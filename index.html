<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d0d">
<title>Finance</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --up:#006300;
  --chip:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --surface-1:#1a1a19; --plane:#0d0d0d;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
    --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --up:#0ca30c;
    --chip:#232322;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b; --up:#0ca30c;
  --chip:#232322;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}

/* ---------- lock screen ---------- */
#lock{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;gap:14px}
#lock h1{font-size:22px;margin:0;letter-spacing:-.01em}
#lock p{margin:0;color:var(--text-secondary);font-size:14px;text-align:center;max-width:300px}
#lockForm{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
input[type=password],input[type=search],input[type=text]{
  width:100%;padding:13px 14px;font-size:16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);
}
button.primary{
  padding:13px 14px;font-size:16px;font-weight:600;border-radius:12px;border:0;
  background:var(--s1);color:#fff;cursor:pointer;
}
button.primary:disabled{opacity:.55;cursor:default}
#lockMsg{color:var(--crit);font-size:13.5px;min-height:18px;text-align:center;max-width:320px;line-height:1.45}
.padlock{font-size:34px;line-height:1}
.pwrap{position:relative;display:flex;align-items:center}
.pwrap input{padding-right:60px}
#revealBtn{position:absolute;right:8px;background:transparent;border:0;color:var(--muted);font-size:12.5px;font-weight:600;padding:8px;cursor:pointer}
#buildStamp{font-size:11.5px;color:var(--muted);text-align:center;margin-top:6px;font-variant-numeric:tabular-nums}

/* ---------- header / nav ---------- */
header{position:sticky;top:0;z-index:20;background:var(--plane);padding:10px 0 6px;border-bottom:1px solid var(--border)}
.htop{display:flex;align-items:center;gap:8px;padding:0 14px 8px}
.htop h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em;flex:1}
.iconbtn{background:var(--chip);border:1px solid var(--border);border-radius:9px;padding:6px 9px;font-size:14px;cursor:pointer;color:var(--text-secondary);line-height:1}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 14px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;border:1px solid var(--border);
  background:var(--chip);color:var(--text-secondary);font-size:13.5px;font-weight:550;cursor:pointer;white-space:nowrap;
}
.chip[aria-selected=true]{background:var(--s1);border-color:var(--s1);color:#fff}

/* ---------- filter row ---------- */
.filters{display:flex;gap:8px;align-items:center;padding:10px 0 2px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--chip);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--text-secondary);font-size:13px;font-weight:550;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
select{
  padding:7px 10px;font-size:13.5px;border-radius:10px;border:1px solid var(--border);
  background:var(--chip);color:var(--text-primary);font-weight:550;
}
.fnote{font-size:12px;color:var(--muted);padding:2px 0 0}

/* ---------- cards ---------- */
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:12px}
.card h2{font-size:14px;margin:0 0 2px;font-weight:600;letter-spacing:-.005em}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.cardhead{display:flex;align-items:flex-start;gap:8px}
.cardhead>div{flex:1;min-width:0}
.tbtn{background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:11.5px;padding:4px 8px;cursor:pointer;flex:0 0 auto}

/* ---------- stats ---------- */
.hero{padding:2px 0 6px}
.hero .lab{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.hero .val{font-size:38px;font-weight:680;letter-spacing:-.025em;line-height:1.1;margin-top:2px}
.hero .delta{font-size:13.5px;color:var(--text-secondary);margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 13px}
.tile .lab{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:21px;font-weight:650;letter-spacing:-.02em;margin-top:3px}
.tile .sub{font-size:12px;color:var(--text-secondary);margin-top:1px}
.up{color:var(--up);font-weight:600}
.down{color:var(--crit);font-weight:600}

/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)}
.swatch{width:11px;height:11px;border-radius:3px;flex:0 0 auto}

/* ---------- svg chart ---------- */
.chartbox{position:relative;width:100%}
svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
.dlabel{fill:var(--text-secondary);font-size:11px;font-weight:600}
.tip{
  position:absolute;pointer-events:none;z-index:9;background:var(--surface-1);
  border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12.5px;
  box-shadow:0 6px 20px rgba(0,0,0,.14);min-width:120px;opacity:0;transition:opacity .1s;
}
.tip.on{opacity:1}
.tip b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:3px}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip .row span:last-child{font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.hidden{display:none}
#lock.hidden{display:none}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.tscroll table{min-width:100%;width:max-content}
.tscroll th,.tscroll td{white-space:nowrap;padding-right:12px}

/* ---------- lists ---------- */
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--grid);cursor:pointer}
.row:last-child{border-bottom:0}
.row .meta{flex:1;min-width:0}
.row .m1{font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m2{font-size:12px;color:var(--muted);margin-top:1px}
.row .amt{font-size:14.5px;font-weight:620;font-variant-numeric:tabular-nums;white-space:nowrap}
.flag{display:inline-block;font-size:10.5px;font-weight:650;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:1px}
.flag.big{background:rgba(250,178,25,.18);color:#8a5c00}
.flag.dup{background:rgba(208,59,59,.15);color:#a32626}
:root[data-theme="dark"] .flag.big,html:where(:not([data-theme="light"])) .flag.big{}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .flag.big{color:#fab219}:root:where(:not([data-theme="light"])) .flag.dup{color:#e88}}
:root[data-theme="dark"] .flag.big{color:#fab219}
:root[data-theme="dark"] .flag.dup{color:#e88}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}
.more{width:100%;padding:10px;margin-top:8px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-secondary);font-size:13.5px;font-weight:600;cursor:pointer}
.cat-pill{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);border:1px solid var(--border);color:var(--text-secondary)}
.searchrow{display:flex;gap:8px;margin-top:12px}
.footer{color:var(--muted);font-size:11.5px;text-align:center;padding:22px 8px 6px;line-height:1.6}
</style>
</head>
<body>

<div id="lock">
  <div class="padlock">🔒</div>
  <h1>Personal Finance</h1>
  <p>Enter your passphrase to unlock. Nothing is readable without it.</p>
  <form id="lockForm">
    <div class="pwrap">
      <input type="password" id="pass" autocomplete="off" placeholder="Passphrase" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text">
      <button type="button" id="revealBtn" aria-label="Show passphrase">show</button>
    </div>
    <button class="primary" type="submit" id="unlockBtn">Unlock</button>
    <div id="lockMsg" role="status"></div>
  </form>
  <div id="buildStamp"></div>
</div>

<div id="app" class="hidden">
  <header>
    <div class="htop">
      <h1 id="appTitle">Personal Finance</h1>
      <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">◐</button>
      <button class="iconbtn" id="lockBtn" title="Lock" aria-label="Lock">🔒</button>
    </div>
    <div class="chips" role="tablist" id="tabs"></div>
  </header>
  <div class="wrap" id="view"></div>
  <div class="footer" id="foot"></div>
</div>

const KDF_ITER = 250000;
const BUILD_ID = "2026-08-19.0328";

function b64d(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}

async function decrypt(pass){
  const raw = b64d(PAYLOAD);
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt, iterations:KDF_ITER, hash:"SHA-256"},
    km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}

let DB = null;

const stamp=document.getElementById("buildStamp");
stamp.textContent = "Build " + BUILD_ID;

// WebCrypto needs a secure context. If it's missing, say so plainly —
// otherwise every failure looks like a typo.
const CRYPTO_OK = !!(window.crypto && window.crypto.subtle);
if(!CRYPTO_OK){
  document.getElementById("lockMsg").innerHTML =
    "This browser can't decrypt the page here.<br>Open it over <b>https://</b> (your GitHub Pages link) rather than from a file preview or a plain http:// address.";
  document.getElementById("unlockBtn").disabled = true;
}

document.getElementById("revealBtn").addEventListener("click",()=>{
  const i=document.getElementById("pass"), b=document.getElementById("revealBtn");
  const show = i.type==="password";
  i.type = show ? "text" : "password";
  b.textContent = show ? "hide" : "show";
});

let unlocking=false;
async function attemptUnlock(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  if(unlocking) return;
  unlocking=true;
  try{ await doUnlock(); } finally { unlocking=false; }
}
// Bind every route to unlock. A sandboxed preview iframe (like a chat file card)
// blocks form submission outright, so the submit event alone is not enough.
document.getElementById("lockForm").addEventListener("submit", attemptUnlock);
document.getElementById("unlockBtn").addEventListener("click", attemptUnlock);
document.getElementById("pass").addEventListener("keydown", ev=>{
  if(ev.key==="Enter") attemptUnlock(ev);
});

async function doUnlock(){
  const btn=document.getElementById("unlockBtn"), msg=document.getElementById("lockMsg");
  const input=document.getElementById("pass");
  const pv=input.value;
  if(!pv){msg.textContent="Enter your passphrase.";return;}
  btn.disabled=true; btn.textContent="Unlocking…"; msg.textContent="";
  // try it exactly as typed, then trimmed — pasting often drags in a space or newline
  const tries=[pv]; if(pv.trim()!==pv) tries.push(pv.trim());
  let lastErr=null;
  for(const t of tries){
    try{
      DB = await decrypt(t);
      input.value="";
      document.getElementById("lock").classList.add("hidden");
      document.getElementById("app").classList.remove("hidden");
      boot();
      return;
    }catch(err){ lastErr=err; }
  }
  if(lastErr && lastErr.name!=="OperationError"){
    msg.innerHTML = "Couldn't decrypt — this browser blocked it.<br><span style='color:var(--muted)'>"+esc(lastErr.name+": "+lastErr.message)+"</span>";
  }else{
    msg.innerHTML = "That passphrase didn't work.<br><span style='color:var(--muted)'>Tap <b>show</b> to check for a stray space or capital, and confirm this is build "+esc(BUILD_ID)+".</span>";
  }
  btn.disabled=false; btn.textContent="Unlock";
}
document.getElementById("lockBtn")?.addEventListener("click", ()=>location.reload());
document.getElementById("themeBtn")?.addEventListener("click", ()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=matchMedia("(prefers-color-scheme: dark)").matches;
  const next = cur ? (cur==="dark"?"light":"dark") : (sysDark?"light":"dark");
  document.documentElement.setAttribute("data-theme", next);
  render();
});

/* ================= helpers ================= */
const MONN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const mlabel = k => k ? MONN[+k.slice(5,7)-1] + " " + k.slice(2,4) : "";
const mlong  = k => k ? MONN[+k.slice(5,7)-1] + " " + k.slice(0,4) : "";
const snap   = n => { const r=Math.round((n||0)*100)/100; return r===0?0:r; };
const money  = n => { n=snap(n); return (n<0?"-":"") + "$" + Math.abs(n).toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2}); };
const money0 = n => { n=snap(n); const r=Math.round(Math.abs(n)); return (n<0&&r>0?"-":"") + "$" + r.toLocaleString("en-SG"); };
const compact= n => { const a=Math.abs(n); if(a>=1000) return (n<0?"-":"")+"$"+(a/1000).toFixed(a>=10000?0:1)+"k"; return (n<0?"-":"")+"$"+Math.round(a); };
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const dlabel = iso => iso ? (+iso.slice(8,10)) + " " + MONN[+iso.slice(5,7)-1] : "";

/* ================= state ================= */
const S = { tab:"overview", basis:"cal", month:"all", cat:null, card:null, q:"", limit:60, tables:{crdm:true} };
const NOISE=/\b(visa|mastercard|world|card|platinum)\b/gi;
const shortCard = c => (String(c).replace(NOISE,"").replace(/\s+/g," ").trim()) || c;
const TABS = [["overview","Overview"],["spend","Spending"],["cats","Categories"],["cards","Cards"],["tx","Transactions"],["subs","Subscriptions"]];

function monthKey(t){ return (S.basis==="cal" ? t.p : t.s).slice(0,7); }
function allMonths(){
  const s=new Set(DB.tx.map(monthKey));
  return [...s].sort();
}
function scoped(){
  return DB.tx.filter(t=> S.month==="all" || monthKey(t)===S.month);
}

/* ================= anomaly detection ================= */
function computeFlags(){
  const byCat={};
  DB.tx.forEach(t=>{ (byCat[t.g]=byCat[t.g]||[]).push(t.a); });
  const med={};
  for(const k in byCat){ const a=byCat[k].slice().sort((x,y)=>x-y); med[k]=a[Math.floor(a.length/2)]; }
  const seen={};
  DB.tx.forEach(t=>{
    t.fBig = t.a >= 500 || (med[t.g]>0 && t.a >= med[t.g]*8 && t.a>=60);
    const k = t.m.toLowerCase()+"|"+t.a.toFixed(2);
    (seen[k]=seen[k]||[]).push(t);
  });
  DB.tx.forEach(t=>t.fDup=false);
  for(const k in seen){
    const g=seen[k]; if(g.length<2) continue;
    g.sort((a,b)=>a.t.localeCompare(b.t));
    for(let i=1;i<g.length;i++){
      const d=(new Date(g[i].t)-new Date(g[i-1].t))/86400000;
      if(d<=3 && g[i].c===g[i-1].c){ g[i].fDup=true; g[i-1].fDup=true; }
    }
  }
}

/* ================= chart primitives ================= */
let tipEl=null;
function tipFor(box){
  let t=box.querySelector(".tip");
  if(!t){ t=document.createElement("div"); t.className="tip"; box.appendChild(t); }
  return t;
}
function placeTip(box,t,x,y){
  const bw=box.clientWidth, tw=t.offsetWidth||140;
  let left=x-tw/2; left=Math.max(2,Math.min(left,bw-tw-2));
  t.style.left=left+"px"; t.style.top=Math.max(0,y)+"px"; t.classList.add("on");
}
function niceMax(v){
  if(v<=0) return 1;
  const e=Math.pow(10,Math.floor(Math.log10(v))); const n=v/e;
  const m = n<=1?1 : n<=1.5?1.5 : n<=2?2 : n<=2.5?2.5 : n<=3?3 : n<=4?4 : n<=5?5 : n<=7.5?7.5 : 10;
  return m*e;
}
const SVGNS="http://www.w3.org/2000/svg";
function el(n,a){const e=document.createElementNS(SVGNS,n);for(const k in a)e.setAttribute(k,a[k]);return e;}

/* --- vertical bar chart (single series) --- */
function barChart(host, labels, values, opt){
  opt=opt||{};
  const W=Math.max(280, host.clientWidth||320), H=opt.h||190;
  const P={t:14,r:6,b:24,l:38};
  const box=document.createElement("div"); box.className="chartbox"; host.appendChild(box);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"}); box.appendChild(svg);
  const max=niceMax(Math.max(...values,0)), min=Math.min(0,...values);
  const lo=min<0?niceMax(-min)*-1:0;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const y=v=>P.t+ih-((v-lo)/(max-lo))*ih;
  for(let i=0;i<=4;i++){
    const v=lo+(max-lo)*i/4;
    svg.appendChild(el("line",{class:"gridline",x1:P.l,x2:W-P.r,y1:y(v),y2:y(v)}));
    const tx=el("text",{class:"tick",x:P.l-6,y:y(v)+3.5,"text-anchor":"end"}); tx.textContent=compact(v); svg.appendChild(tx);
  }
  const n=values.length, step=iw/n, bw=Math.min(34, step*0.62);
  const tip=tipFor(box);
  values.forEach((v,i)=>{
    const cx=P.l+step*i+step/2;
    const y0=y(Math.max(0,lo)), y1=y(v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
    const r=el("rect",{x:cx-bw/2,y:top,width:bw,height:h,rx:4,fill:opt.color||cssv("--s1")});
    if(opt.dim && opt.dim(i)) r.setAttribute("opacity",".35");
    svg.appendChild(r);
    const hit=el("rect",{x:P.l+step*i,y:P.t,width:step,height:ih,fill:"transparent"});
    hit.style.cursor="pointer";
    const show=()=>{ tip.innerHTML=`<b>${esc(opt.full?opt.full[i]:labels[i])}</b><div class="row"><span>${esc(opt.name||"Total")}</span><span>${money(v)}</span></div>`+(opt.extra?opt.extra(i):"");
      placeTip(box,tip,cx,Math.max(0,top-54)); };
    hit.addEventListener("pointerenter",show); hit.addEventListener("pointerdown",show);
    hit.addEventListener("pointerleave",()=>tip.classList.remove("on"));
    if(opt.onclick) hit.addEventListener("click",()=>opt.onclick(i));
    svg.appendChild(hit);
    const tl=el("text",{class:"tick",x:cx,y:H-8,"text-anchor":"middle"}); tl.textContent=labels[i]; svg.appendChild(tl);
  });
  svg.appendChild(el("line",{class:"axisline",x1:P.l,x2:W-P.r,y1:y(Math.max(0,lo)),y2:y(Math.max(0,lo))}));
  box.addEventListener("pointerleave",()=>tip.classList.remove("on"));
}

/* --- multi-series line chart --- */
function lineChart(host, labels, series, opt){
  opt=opt||{};
  const W=Math.max(280,host.clientWidth||320), H=opt.h||200;
  const P={t:14,r:10,b:24,l:40};
  const box=document.createElement("div"); box.className="chartbox"; host.appendChild(box);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"}); box.appendChild(svg);
  const flat=series.flatMap(s=>s.v.filter(v=>v!==null&&v!==undefined));
  const rawMax=Math.max(...flat,0), rawMin=Math.min(...flat,0);
  const max=niceMax(rawMax), lo=rawMin<0?-niceMax(-rawMin):0;
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const x=i=>P.l+(labels.length<2?iw/2:iw*i/(labels.length-1));
  const y=v=>P.t+ih-((v-lo)/(max-lo))*ih;
  for(let i=0;i<=4;i++){
    const v=lo+(max-lo)*i/4;
    svg.appendChild(el("line",{class:"gridline",x1:P.l,x2:W-P.r,y1:y(v),y2:y(v)}));
    const tx=el("text",{class:"tick",x:P.l-6,y:y(v)+3.5,"text-anchor":"end"}); tx.textContent=compact(v); svg.appendChild(tx);
  }
  if(lo<0) svg.appendChild(el("line",{class:"axisline",x1:P.l,x2:W-P.r,y1:y(0),y2:y(0)}));
  const cross=el("line",{class:"axisline",x1:0,x2:0,y1:P.t,y2:P.t+ih,opacity:0}); svg.appendChild(cross);
  series.forEach(s=>{
    let d="",open=false;
    s.v.forEach((v,i)=>{ if(v===null||v===undefined){open=false;return;} d+=(open?"L":"M")+x(i)+" "+y(v)+" "; open=true; });
    svg.appendChild(el("path",{d,fill:"none",stroke:s.color,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"}));
    s.v.forEach((v,i)=>{ if(v===null||v===undefined)return;
      svg.appendChild(el("circle",{cx:x(i),cy:y(v),r:3.2,fill:s.color,stroke:cssv("--surface-1"),"stroke-width":2})); });
  });
  // anchor label ticks to the LAST point so the newest month is always labelled
  const perLabel=44, every=Math.max(1,Math.ceil(labels.length/Math.max(1,Math.floor(iw/perLabel))));
  const N=labels.length-1;
  for(let i=N;i>=0;i-=every){
    const t=el("text",{class:"tick",x:x(i),y:H-8,"text-anchor":i===N?"end":(i===0?"start":"middle")});
    t.textContent=labels[i]; svg.appendChild(t);
  }
  const tip=tipFor(box);
  const hit=el("rect",{x:P.l,y:P.t,width:iw,height:ih,fill:"transparent"});
  const move=(ev)=>{
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)*(W/r.width);
    let i=Math.round((px-P.l)/(iw/(labels.length-1||1)));
    i=Math.max(0,Math.min(labels.length-1,i));
    cross.setAttribute("x1",x(i)); cross.setAttribute("x2",x(i)); cross.setAttribute("opacity",1);
    let h=`<b>${esc(opt.full?opt.full[i]:labels[i])}</b>`;
    series.forEach(s=>{ const v=s.v[i]; if(v===null||v===undefined)return;
      h+=`<div class="row"><span><span class="swatch" style="background:${s.color};display:inline-block"></span> ${esc(s.name)}</span><span>${money0(v)}</span></div>`; });
    tip.innerHTML=h; placeTip(box,tip,x(i)*(box.clientWidth/W), 0);
  };
  hit.addEventListener("pointermove",move); hit.addEventListener("pointerdown",move);
  svg.appendChild(hit);
  box.addEventListener("pointerleave",()=>{tip.classList.remove("on");cross.setAttribute("opacity",0);});
}

/* --- stacked bar chart --- */
function stackChart(host, labels, series, opt){
  opt=opt||{};
  const W=Math.max(280, host.clientWidth||320), H=opt.h||220;
  const P={t:20,r:6,b:24,l:44};
  const box=document.createElement("div"); box.className="chartbox"; host.appendChild(box);
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"}); box.appendChild(svg);
  const totals=labels.map((_,i)=>series.reduce((a,s)=>a+(s.v[i]||0),0));
  const max=niceMax(Math.max(...totals,0));
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  const y=val=>P.t+ih-(val/max)*ih;
  for(let i=0;i<=4;i++){
    const val=max*i/4;
    svg.appendChild(el("line",{class:"gridline",x1:P.l,x2:W-P.r,y1:y(val),y2:y(val)}));
    const tx=el("text",{class:"tick",x:P.l-6,y:y(val)+3.5,"text-anchor":"end"});
    tx.textContent=opt.fmt?opt.fmt(val):compact(val); svg.appendChild(tx);
  }
  const n=labels.length, step=iw/n, bw=Math.min(56, step*0.58);
  const tip=tipFor(box);
  labels.forEach((l,i)=>{
    const cx=P.l+step*i+step/2;
    let acc=0;
    series.forEach(s=>{
      const val=s.v[i]||0; if(val<=0) return;
      const y1=y(acc), y0=y(acc+val);
      const h=Math.max(1,(y1-y0)-2);            // 2px surface gap between segments
      svg.appendChild(el("rect",{x:cx-bw/2,y:y0,width:bw,height:h,rx:3,fill:s.color}));
      acc+=val;
    });
    const lt=el("text",{class:"dlabel",x:cx,y:y(acc)-7,"text-anchor":"middle"});
    lt.textContent=opt.totalFmt?opt.totalFmt(totals[i]):compact(totals[i]); svg.appendChild(lt);
    const hit=el("rect",{x:P.l+step*i,y:P.t,width:step,height:ih,fill:"transparent"});
    hit.style.cursor="pointer";
    const show=()=>{
      let h=`<b>${esc(l)}</b>`;
      series.slice().reverse().forEach(s=>{ const val=s.v[i]||0; if(!val) return;
        h+=`<div class="row"><span><span class="swatch" style="background:${s.color};display:inline-block"></span> ${esc(s.name)}</span><span>${(opt.tipFmt||money0)(val)}</span></div>`; });
      h+=`<div class="row" style="margin-top:4px;border-top:1px solid var(--grid);padding-top:4px"><span>Total</span><span>${(opt.tipFmt||money0)(totals[i])}</span></div>`;
      tip.innerHTML=h; placeTip(box,tip,cx,0);
    };
    hit.addEventListener("pointerenter",show); hit.addEventListener("pointerdown",show);
    svg.appendChild(hit);
    const tl=el("text",{class:"tick",x:cx,y:H-8,"text-anchor":"middle"}); tl.textContent=l; svg.appendChild(tl);
  });
  svg.appendChild(el("line",{class:"axisline",x1:P.l,x2:W-P.r,y1:y(0),y2:y(0)}));
  box.addEventListener("pointerleave",()=>tip.classList.remove("on"));
}

/* --- horizontal bars --- */
function hbar(host, items, opt){
  opt=opt||{};
  const max=Math.max(...items.map(i=>Math.abs(i.v)),1);
  const w=document.createElement("div");
  items.forEach(it=>{
    const row=document.createElement("div");
    row.style.cssText="padding:7px 0;cursor:"+(opt.onclick?"pointer":"default");
    const pct=Math.max(1.5,Math.abs(it.v)/max*100);
    row.innerHTML=
      `<div style="display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px">
         <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.k)}</span>
         <span style="font-variant-numeric:tabular-nums;font-weight:620;flex:0 0 auto">${money(it.v)}</span>
       </div>
       <div style="height:8px;border-radius:4px;background:var(--grid);overflow:hidden">
         <div style="height:100%;width:${pct}%;border-radius:4px;background:${it.v<0?cssv("--s2"):(opt.color||cssv("--s1"))}"></div>
       </div>`;
    if(opt.onclick) row.addEventListener("click",()=>opt.onclick(it));
    w.appendChild(row);
  });
  host.appendChild(w);
}

/* ================= card scaffold ================= */
function card(title, sub){
  const c=document.createElement("div"); c.className="card";
  const h=document.createElement("div"); h.className="cardhead";
  h.innerHTML=`<div><h2>${esc(title)}</h2>${sub?`<p class="sub">${esc(sub)}</p>`:""}</div>`;
  c.appendChild(h);
  return c;
}
function withTable(c, id, rows, cols){
  const btn=document.createElement("button"); btn.className="tbtn"; btn.textContent=S.tables[id]?"Chart":"Table";
  c.querySelector(".cardhead").appendChild(btn);
  const t=document.createElement("div"); t.className=S.tables[id]?"tscroll":"hidden";
  let html="<table><thead><tr>"+cols.map((c,i)=>`<th class="${i?"num":""}">${esc(c)}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{ html+="<tr>"+r.map((v,i)=>`<td class="${i?"num":""}">${esc(v)}</td>`).join("")+"</tr>"; });
  t.innerHTML=html+"</tbody></table>";
  c.appendChild(t);
  btn.addEventListener("click",()=>{ S.tables[id]=!S.tables[id]; render(); });
  return S.tables[id];
}

/* ================= views ================= */
function filterRow(host, opts){
  const f=document.createElement("div"); f.className="filters";
  const months=allMonths();
  let h=`<select id="mSel"><option value="all">All months</option>`;
  months.slice().reverse().forEach(m=>{ h+=`<option value="${m}"${S.month===m?" selected":""}>${mlong(m)}</option>`; });
  h+=`</select>`;
  if(opts!==false){
    h+=`<div class="seg" role="group" aria-label="Month basis">
      <button data-b="cal" aria-pressed="${S.basis==="cal"}">Calendar</button>
      <button data-b="stm" aria-pressed="${S.basis==="stm"}">Statement</button></div>`;
  }
  f.innerHTML=h; host.appendChild(f);
  const note=document.createElement("div"); note.className="fnote";
  note.textContent = S.basis==="cal" ? "Grouped by post date — how the money actually left." : "Grouped by the statement each charge landed on.";
  if(opts!==false) host.appendChild(note);
  f.querySelector("#mSel").addEventListener("change",e=>{S.month=e.target.value;S.limit=60;render();});
  f.querySelectorAll("[data-b]").forEach(b=>b.addEventListener("click",()=>{S.basis=b.dataset.b;render();}));
}

function sumBy(list, keyFn){
  const m={}; list.forEach(t=>{ const k=keyFn(t); m[k]=(m[k]||0)+t.a; });
  return m;
}

    const kfmt=n=>n>=1000?Math.round(n/1000)+"k":String(Math.round(n));
    stackChart(host, pk.map(i=>mi.periods[i]),
      names.map((nm,k)=>({name:nm,color:mc[k%mc.length],v:pk.map(i=>mi.programs[nm][i]||0)})),
      {h:225, fmt:kfmt, totalFmt:kfmt, tipFmt:n=>n.toLocaleString("en-SG")});
    const lg=document.createElement("div"); lg.className="legend";

function vSpend(v){
  filterRow(v);
  const months=allMonths();
  const tot=months.map(m=>DB.tx.filter(t=>monthKey(t)===m).reduce((a,t)=>a+t.a,0));
  const c=card("Card spend by month", S.basis==="cal"?"By post date":"By statement month");
  const t=withTable(c,"spm",months.map((m,i)=>[mlong(m),money(tot[i])]),["Month","Spend"]);
  if(!t){
    const host=document.createElement("div"); c.appendChild(host); v.appendChild(c);
    barChart(host,months.map(mlabel),tot,{
      full:months.map(mlong), name:"Card spend",
      dim:i=>S.month!=="all"&&months[i]!==S.month,
      onclick:i=>{S.month=(S.month===months[i]?"all":months[i]);S.limit=60;render();}
    });
    const n=document.createElement("p"); n.className="sub"; n.style.marginTop="6px";
    n.textContent="Tap a bar to filter every view to that month.";
    c.appendChild(n);
  } else v.appendChild(c);

  const i=months.length-1;
  if(i>0){
    const d=tot[i]-tot[i-1], p=tot[i-1]?d/tot[i-1]*100:0;
    const t2=document.createElement("div"); t2.className="tiles";
    const list=scoped();
    const big=list.slice().sort((a,b)=>b.a-a.a)[0];
    t2.innerHTML=`
     <div class="tile"><div class="lab">Latest vs prior</div><div class="val ${d<=0?"up":"down"}">${d<=0?"▼":"▲"} ${money0(Math.abs(d))}</div><div class="sub">${mlabel(months[i])} vs ${mlabel(months[i-1])} (${p>=0?"+":""}${p.toFixed(0)}%)</div></div>
     <div class="tile"><div class="lab">Largest charge</div><div class="val">${money0(big?big.a:0)}</div><div class="sub">${esc(big?big.m:"—")}</div></div>`;
    v.appendChild(t2);
  }

  // category mix over time as small stacked-free view: top 5 categories, lines
  const list=DB.tx;
  const catTot=sumBy(list,t=>t.g);
  const top=Object.entries(catTot).sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>x[0]);
  const cols=[cssv("--s1"),cssv("--s2"),cssv("--s3")];
  const c3=card("Biggest three categories over time","Everything else is in the Categories tab");
  const rows=months.map(m=>[mlong(m),...top.map(g=>money0(DB.tx.filter(t=>monthKey(t)===m&&t.g===g).reduce((a,t)=>a+t.a,0)))]);
  const t3=withTable(c3,"cmix",rows,["Month",...top]);
  if(!t3){
    const host=document.createElement("div"); c3.appendChild(host); v.appendChild(c3);
    lineChart(host,months.map(mlabel),top.map((g,k)=>({name:g,color:cols[k],
      v:months.map(m=>DB.tx.filter(t=>monthKey(t)===m&&t.g===g).reduce((a,t)=>a+t.a,0))})),{full:months.map(mlong)});
    const lg=document.createElement("div"); lg.className="legend";
    lg.innerHTML=top.map((g,k)=>`<span><i class="swatch" style="background:${cols[k]}"></i>${esc(g)}</span>`).join("");
    c3.appendChild(lg);
  } else v.appendChild(c3);
}

function vCats(v){
  filterRow(v);
  const list=scoped();
  const m=sumBy(list,t=>t.g);
  const items=Object.entries(m).map(([k,x])=>({k,v:snap(x)})).sort((a,b)=>b.v-a.v);
  const total=items.reduce((a,i)=>a+i.v,0);
  const c=card("Spend by category", (S.month==="all"?"All months":mlong(S.month))+" · "+money(total));
  const t=withTable(c,"cat",items.map(i=>[i.k,money(i.v),(total?i.v/total*100:0).toFixed(1)+"%"]),["Category","Spend","Share"]);
  if(!t){
    const host=document.createElement("div"); c.appendChild(host);
    hbar(host,items,{onclick:it=>{S.cat=it.k;S.tab="tx";S.limit=60;render();}});
    const n=document.createElement("p"); n.className="sub"; n.style.marginTop="8px";
    n.textContent="Tap a category to see its transactions.";
    c.appendChild(n);
  }
  v.appendChild(c);
}

function vCards(v){
  filterRow(v);
  const list=scoped();
  const m=sumBy(list,t=>t.c);
  const items=Object.entries(m).map(([k,x])=>({k,v:snap(x)})).sort((a,b)=>b.v-a.v);
  const total=items.reduce((a,i)=>a+i.v,0);
  const c=card("Spend by card",(S.month==="all"?"All months":mlong(S.month))+" · "+money(total));
  const t=withTable(c,"crd",items.map(i=>[i.k,money(i.v),(total?i.v/total*100:0).toFixed(1)+"%"]),["Card","Spend","Share"]);
  if(!t){
    const host=document.createElement("div"); c.appendChild(host);
    hbar(host,items,{onclick:it=>{S.card=it.k;S.tab="tx";S.limit=60;render();}});
    const n=document.createElement("p"); n.className="sub"; n.style.marginTop="8px";
    n.textContent="Tap a card to see its transactions.";
    c.appendChild(n);
  }
  v.appendChild(c);

  const months=allMonths();
  const c2=card("Card usage each month","Swipe the table sideways to see every card");
  const rows=months.map(mo=>[mlong(mo),...items.map(i=>money0(DB.tx.filter(t=>monthKey(t)===mo&&t.c===i.k).reduce((a,t)=>a+t.a,0)))]);
  withTable(c2,"crdm",rows,["Month",...items.map(i=>shortCard(i.k))]);
  c2.querySelector(".tbtn").classList.add("hidden");
  v.appendChild(c2);
}

function vTx(v){
  filterRow(v);
  const sr=document.createElement("div"); sr.className="searchrow";
  sr.innerHTML=`<input type="search" id="q" placeholder="Search merchant…" value="${esc(S.q)}" autocapitalize="off" autocorrect="off">`;
  v.appendChild(sr);

  const active=[];
  if(S.cat) active.push(["cat",S.cat]);
  if(S.card) active.push(["card",S.card]);
  if(active.length){
    const a=document.createElement("div"); a.className="filters";
    a.innerHTML=active.map(([k,val])=>`<button class="chip" aria-selected="true" data-clear="${k}">${esc(val)} ✕</button>`).join("");
    v.appendChild(a);
    a.querySelectorAll("[data-clear]").forEach(b=>b.addEventListener("click",()=>{S[b.dataset.clear]=null;render();}));
  }

  let list=scoped();
  if(S.cat) list=list.filter(t=>t.g===S.cat);
  if(S.card) list=list.filter(t=>t.c===S.card);
  if(S.q.trim()){ const q=S.q.trim().toLowerCase(); list=list.filter(t=>t.m.toLowerCase().includes(q)||t.g.toLowerCase().includes(q)); }
  list=list.slice().sort((a,b)=> b.t.localeCompare(a.t) || b.a-a.a);
  const total=list.reduce((a,t)=>a+t.a,0);
  const flagged=list.filter(t=>t.fBig||t.fDup).length;

  const c=card(`${list.length} transaction${list.length===1?"":"s"}`, money(total)+(flagged?` · ${flagged} flagged`:""));
  const body=document.createElement("div"); c.appendChild(body);
  if(!list.length) body.innerHTML=`<div class="empty">Nothing matches those filters.</div>`;
  list.slice(0,S.limit).forEach(t=>{
    const r=document.createElement("div"); r.className="row";
    r.innerHTML=`<div class="meta">
        <div class="m1">${esc(t.m)}${t.fBig?'<span class="flag big">LARGE</span>':""}${t.fDup?'<span class="flag dup">DUPLICATE?</span>':""}</div>
        <div class="m2">${dlabel(t.t)} · ${esc(t.c)} · <span class="cat-pill">${esc(t.g)}</span></div>
      </div><div class="amt">${money(t.a)}</div>`;
    r.addEventListener("click",()=>{S.cat=t.g;S.limit=60;render();});
    body.appendChild(r);
  });
  if(list.length>S.limit){
    const b=document.createElement("button"); b.className="more"; b.textContent=`Show ${Math.min(60,list.length-S.limit)} more`;
    b.addEventListener("click",()=>{S.limit+=60;render();});
    c.appendChild(b);
  }
  v.appendChild(c);

  const qi=document.getElementById("q");
  qi.addEventListener("input",e=>{ S.q=e.target.value; S.limit=60; const p=e.target.selectionStart; render();
    const n=document.getElementById("q"); if(n){n.focus(); try{n.setSelectionRange(p,p);}catch(_){}}
  });
}

function vSubs(v){
  const tot=DB.subs.reduce((a,x)=>a+x.annual,0);
  const c=card("Subscriptions", `${DB.subs.length} active · ${money(tot/12)}/month · ${money(tot)}/year`);
  const items=DB.subs.map(s=>({k:s.name+" · "+s.interval.toLowerCase(),v:s.annual/12}))
                     .sort((a,b)=>b.v-a.v);
  const t=withTable(c,"sub",DB.subs.slice().sort((a,b)=>b.annual-a.annual)
      .map(s=>[s.name,money(s.amt),s.interval,money(s.annual),s.card]),["Name","Charge","Every","Per year","Card"]);
  if(!t){
    const host=document.createElement("div"); c.appendChild(host);
    hbar(host,items);
    const n=document.createElement("p"); n.className="sub"; n.style.marginTop="8px";
    n.textContent="Annual plans shown at their monthly equivalent.";
    c.appendChild(n);
  }
  v.appendChild(c);
}

/* ================= render ================= */
function render(){
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=TABS.map(([k,l])=>`<button class="chip" role="tab" data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join("");
  tabs.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{S.tab=b.dataset.t;S.limit=60;render();window.scrollTo(0,0);}));
  const v=document.getElementById("view"); v.innerHTML="";
  ({overview:vOverview,spend:vSpend,cats:vCats,cards:vCards,tx:vTx,subs:vSubs}[S.tab])(v);
  document.getElementById("foot").innerHTML=
    `${DB.tx.length} transactions · ${mlong(allMonths()[0])} – ${mlong(allMonths().slice(-1)[0])}<br>Synced from PERSONAL FINANCE sheet on ${DB.generated}`;
}
function boot(){ computeFlags(); render(); }
addEventListener("resize",()=>{ if(DB) render(); });
</script>
</body>
</html>
